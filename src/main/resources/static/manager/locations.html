<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Management - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Location Management</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Logout</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="users.html" class="nav-link">Users</a>
            <a href="locations.html" class="nav-link active">Locations</a>
            <a href="create-appointment.html" class="nav-link">Create Appointment</a>
            <a href="analytics.html" class="nav-link">Analytics</a>
        </nav>
        
        <main>
            <button onclick="showAddLocationForm()" class="button">Add Location</button>
            
            <div id="addLocationForm" class="form-container" style="display: none;">
                <h2>Add Location</h2>
                <form id="locationForm">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type:</label>
                        <select id="type" name="type" required>
                            <option value="hospital">Hospital</option>
                            <option value="clinic">Clinic</option>
                            <option value="retirement_home">Retirement Home</option>
                            <option value="ltc">Long-Term Care</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="openingHour">Opening Hour:</label>
                        <input type="time" id="openingHour" name="openingHour" required>
                    </div>
                    <div class="form-group">
                        <label for="closingHour">Closing Hour:</label>
                        <input type="time" id="closingHour" name="closingHour" required>
                    </div>
                    <div class="form-group">
                        <label for="capacityPerDay">Daily Capacity:</label>
                        <input type="number" id="capacityPerDay" name="capacityPerDay" required>
                    </div>
                    <button type="submit" class="button">Create</button>
                    <button type="button" onclick="hideAddLocationForm()" class="button">Cancel</button>
                </form>
            </div>
            
            <div id="locationsList" class="locations-list"></div>
        </main>
    </div>
    <script src="manager.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadLocations();
        });
        
        document.getElementById('locationForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            await addLocation(event);
        });
    </script>
</body>
</html>
