<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes rendez-vous - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mes rendez-vous</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Déconnexion</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Tableau de bord</a>
            <a href="appointments.html" class="nav-link active">Rendez-vous</a>
            <a href="patients.html" class="nav-link">Patients</a>
        </nav>
        
        <main>
            <div class="filters">
                <label for="statusFilter">Filtrer par statut:</label>
                <select id="statusFilter" onchange="filterAppointments()">
                    <option value="">Tous</option>
                    <option value="Planned">Planifié</option>
                    <option value="InProgress">En cours</option>
                    <option value="Completed">Terminé</option>
                    <option value="Cancelled">Annulé</option>
                </select>
                
                <label for="priorityFilter">Filtrer par priorité:</label>
                <select id="priorityFilter" onchange="filterAppointments()">
                    <option value="">Tous</option>
                    <option value="Low">Faible</option>
                    <option value="Medium">Moyenne</option>
                    <option value="High">Élevée</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            
            <div id="appointmentsList" class="appointments-list"></div>
        </main>
    </div>
    <script src="client.js"></script>
    <script>
        let allAppointments = [];
        
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadMyAppointments();
        });
    </script>
</body>
</html>
