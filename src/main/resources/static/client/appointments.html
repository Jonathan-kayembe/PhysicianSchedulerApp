<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Appointments</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Logout</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="appointments.html" class="nav-link active">Appointments</a>
            <a href="patients.html" class="nav-link">Patients</a>
            <a href="profile.html" class="nav-link">Profile</a>
        </nav>
        
        <main>
            <div class="filters">
                <label for="statusFilter">Filter by status:</label>
                <select id="statusFilter" onchange="filterAppointments()">
                    <option value="">All</option>
                    <option value="Planned">Planned</option>
                    <option value="InProgress">In Progress</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
                
                <label for="priorityFilter">Filter by priority:</label>
                <select id="priorityFilter" onchange="filterAppointments()">
                    <option value="">All</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            
            <div id="appointmentsList" class="appointments-list"></div>
        </main>
    </div>
    <script src="client.js"></script>
    <script>
        let allAppointments = [];
        
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadMyAppointments();
        });
    </script>
</body>
</html>
