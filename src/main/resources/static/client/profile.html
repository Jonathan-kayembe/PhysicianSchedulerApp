<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Profile</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Logout</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="appointments.html" class="nav-link">Appointments</a>
            <a href="patients.html" class="nav-link">Patients</a>
            <a href="profile.html" class="nav-link active">Profile</a>
        </nav>
        
        <main>
            <div class="section">
                <div id="profileInfo" class="profile-container">
                    <p>Loading profile information...</p>
                </div>
                
                <div class="section" id="editProfileSection" style="display: none;">
                    <h2>Edit Profile</h2>
                    <form id="editProfileForm">
                        <div class="form-group">
                            <label for="editFullName">Full Name:</label>
                            <input type="text" id="editFullName" name="fullName" required>
                        </div>
                        <div class="form-group">
                            <label for="editEmail">Email:</label>
                            <input type="email" id="editEmail" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Role:</label>
                            <input type="text" id="editRole" readonly style="background-color: #f0f0f0;">
                        </div>
                        <button type="submit" class="button">Save Changes</button>
                        <button type="button" onclick="cancelEdit()" class="button" style="background-color: #ccc;">Cancel</button>
                    </form>
                    <div id="profileMessage" style="margin-top: 10px;"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="client.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadProfileInfo();
            
            // Edit profile form handler
            document.getElementById('editProfileForm').addEventListener('submit', async function(event) {
                event.preventDefault();
                await updateProfile(event);
            });
        });
    </script>
</body>
</html>
