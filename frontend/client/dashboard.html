<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Logout</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link active">Dashboard</a>
            <a href="appointments.html" class="nav-link">Appointments</a>
            <a href="patients.html" class="nav-link">Patients</a>
            <a href="profile.html" class="nav-link">Profile</a>
        </nav>
        
        <main>
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Today's Appointments</h3>
                    <p id="todayAppointments">0</p>
                </div>
                <div class="stat-card">
                    <h3>This Week's Appointments</h3>
                    <p id="weekAppointments">0</p>
                </div>
                <div class="stat-card">
                    <h3>Patients</h3>
                    <p id="totalPatients">0</p>
                </div>
            </div>
            
            <div class="section">
                <h2>Today's Appointments</h2>
                <div id="todayAppointmentsList" class="appointments-list"></div>
            </div>
        </main>
    </div>
    <script src="client.js"></script>
    <script>
        // Load dashboard data on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadDashboardData();
        });
    </script>
</body>
</html>
