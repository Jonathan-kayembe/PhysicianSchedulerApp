<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Manager Dashboard</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Logout</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link active">Dashboard</a>
            <a href="users.html" class="nav-link">Users</a>
            <a href="locations.html" class="nav-link">Locations</a>
            <a href="create-appointment.html" class="nav-link">Create Appointment</a>
            <a href="analytics.html" class="nav-link">Analytics</a>
        </nav>
        
        <main>
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p id="totalUsers">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Patients</h3>
                    <p id="totalPatients">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Appointments</h3>
                    <p id="totalAppointments">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Locations</h3>
                    <p id="totalLocations">0</p>
                </div>
            </div>
            
            <div class="section">
                <h2>Recent Appointments</h2>
                <div id="recentAppointments" class="appointments-list"></div>
            </div>
        </main>
    </div>
    <script src="manager.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadDashboardStats();
        });
    </script>
</body>
</html>
