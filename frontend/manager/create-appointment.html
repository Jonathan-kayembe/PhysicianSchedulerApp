<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un rendez-vous - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Créer un rendez-vous</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Déconnexion</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Tableau de bord</a>
            <a href="users.html" class="nav-link">Utilisateurs</a>
            <a href="locations.html" class="nav-link">Lieux</a>
            <a href="create-appointment.html" class="nav-link active">Créer rendez-vous</a>
            <a href="analytics.html" class="nav-link">Analytiques</a>
        </nav>
        
        <main>
            <div class="section">
                <h2>Nouveau rendez-vous</h2>
                <form id="appointmentForm">
                    <div class="form-group">
                        <label for="userId">Utilisateur:</label>
                        <select id="userId" name="userId" required></select>
                    </div>
                    <div class="form-group">
                        <label for="patientId">Patient:</label>
                        <select id="patientId" name="patientId" required></select>
                    </div>
                    <div class="form-group">
                        <label for="locationId">Lieu:</label>
                        <select id="locationId" name="locationId" required></select>
                    </div>
                    <div class="form-group">
                        <label for="purpose">But:</label>
                        <textarea id="purpose" name="purpose" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="durationMinutes">Durée (minutes):</label>
                        <input type="number" id="durationMinutes" name="durationMinutes" required>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priorité:</label>
                        <select id="priority" name="priority" required>
                            <option value="Low">Faible</option>
                            <option value="Medium">Moyenne</option>
                            <option value="High">Élevée</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Statut:</label>
                        <select id="status" name="status" required>
                            <option value="Planned">Planifié</option>
                            <option value="InProgress">En cours</option>
                            <option value="Completed">Terminé</option>
                            <option value="Cancelled">Annulé</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="appointmentTime">Date et heure:</label>
                        <input type="datetime-local" id="appointmentTime" name="appointmentTime" required>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes:</label>
                        <textarea id="notes" name="notes"></textarea>
                    </div>
                    <button type="submit" class="button">Créer le rendez-vous</button>
                </form>
                <div id="warningMessage" class="warning-message"></div>
            </div>
        </main>
    </div>
    <script src="manager.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadUsersForAppointment();
            loadPatientsForAppointment();
            loadLocationsForAppointment();
        });
        
        document.getElementById('appointmentForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            await createAppointment(event);
        });
    </script>
</body>
</html>
