<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Appointment - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Create Appointment</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Logout</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="users.html" class="nav-link">Users</a>
            <a href="locations.html" class="nav-link">Locations</a>
            <a href="create-appointment.html" class="nav-link active">Create Appointment</a>
            <a href="analytics.html" class="nav-link">Analytics</a>
        </nav>
        
        <main>
            <div class="section">
                <h2>New Appointment</h2>
                <form id="appointmentForm">
                    <div class="form-group">
                        <label for="userId">User:</label>
                        <select id="userId" name="userId" required></select>
                    </div>
                    <div class="form-group">
                        <label for="patientId">Patient:</label>
                        <select id="patientId" name="patientId" required></select>
                    </div>
                    <div class="form-group">
                        <label for="locationId">Location:</label>
                        <select id="locationId" name="locationId" required></select>
                    </div>
                    <div class="form-group">
                        <label for="purpose">Purpose:</label>
                        <textarea id="purpose" name="purpose" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="durationMinutes">Duration (minutes):</label>
                        <input type="number" id="durationMinutes" name="durationMinutes" required>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority:</label>
                        <select id="priority" name="priority" required>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Status:</label>
                        <select id="status" name="status" required>
                            <option value="Planned">Planned</option>
                            <option value="InProgress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="appointmentTime">Date and Time:</label>
                        <input type="datetime-local" id="appointmentTime" name="appointmentTime" required>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes:</label>
                        <textarea id="notes" name="notes"></textarea>
                    </div>
                    <button type="submit" class="button">Create Appointment</button>
                </form>
                <div id="warningMessage" class="warning-message"></div>
            </div>
        </main>
    </div>
    <script src="manager.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadUsersForAppointment();
            loadPatientsForAppointment();
            loadLocationsForAppointment();
        });
        
        document.getElementById('appointmentForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            await createAppointment(event);
        });
    </script>
</body>
</html>
