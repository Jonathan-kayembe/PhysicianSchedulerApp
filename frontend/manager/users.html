<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>User Management</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Logout</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="users.html" class="nav-link active">Users</a>
            <a href="locations.html" class="nav-link">Locations</a>
            <a href="create-appointment.html" class="nav-link">Create Appointment</a>
            <a href="analytics.html" class="nav-link">Analytics</a>
        </nav>
        
        <main>
            <button onclick="showAddUserForm()" class="button">Add User</button>
            
            <div id="addUserForm" class="form-container" style="display: none;">
                <h2>Add User</h2>
                <form id="userForm">
                    <div class="form-group">
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="roleId">Role:</label>
                        <select id="roleId" name="roleId" required>
                            <option value="1">Physician</option>
                            <option value="2">Nurse</option>
                            <option value="3">Staff</option>
                            <option value="4">Manager</option>
                            <option value="5">SuperAdmin</option>
                        </select>
                    </div>
                    <button type="submit" class="button">Create</button>
                    <button type="button" onclick="hideAddUserForm()" class="button">Cancel</button>
                </form>
            </div>
            
            <div id="usersList" class="users-list"></div>
        </main>
    </div>
    <script src="manager.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadUsers();
        });
        
        document.getElementById('userForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            await addUser(event);
        });
    </script>
</body>
</html>
