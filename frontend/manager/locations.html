<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des lieux - Medical Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestion des lieux</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()" class="button">Déconnexion</button>
            </div>
        </header>
        
        <nav>
            <a href="dashboard.html" class="nav-link">Tableau de bord</a>
            <a href="users.html" class="nav-link">Utilisateurs</a>
            <a href="locations.html" class="nav-link active">Lieux</a>
            <a href="create-appointment.html" class="nav-link">Créer rendez-vous</a>
            <a href="analytics.html" class="nav-link">Analytiques</a>
        </nav>
        
        <main>
            <button onclick="showAddLocationForm()" class="button">Ajouter un lieu</button>
            
            <div id="addLocationForm" class="form-container" style="display: none;">
                <h2>Ajouter un lieu</h2>
                <form id="locationForm">
                    <div class="form-group">
                        <label for="name">Nom:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type:</label>
                        <select id="type" name="type" required>
                            <option value="hospital">Hôpital</option>
                            <option value="clinic">Clinique</option>
                            <option value="retirement_home">Maison de retraite</option>
                            <option value="ltc">Soins de longue durée</option>
                            <option value="other">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="openingHour">Heure d'ouverture:</label>
                        <input type="time" id="openingHour" name="openingHour" required>
                    </div>
                    <div class="form-group">
                        <label for="closingHour">Heure de fermeture:</label>
                        <input type="time" id="closingHour" name="closingHour" required>
                    </div>
                    <div class="form-group">
                        <label for="capacityPerDay">Capacité par jour:</label>
                        <input type="number" id="capacityPerDay" name="capacityPerDay" required>
                    </div>
                    <button type="submit" class="button">Créer</button>
                    <button type="button" onclick="hideAddLocationForm()" class="button">Annuler</button>
                </form>
            </div>
            
            <div id="locationsList" class="locations-list"></div>
        </main>
    </div>
    <script src="manager.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadLocations();
        });
        
        document.getElementById('locationForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            await addLocation(event);
        });
    </script>
</body>
</html>
